services:
  db:
    image: postgres:16-alpine
    container_name: siakad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: siakad_db
    ports:
      - "5432:5432"
    volumes:
      - siakad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siakad_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siakad_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: 3000
      DB_DSN: postgres://postgres:password123@db:5432/siakad_db?sslmode=disable
      JWT_SECRET: siakad-mini-super-secret-jwt-key-2026-unair-pbe
      JWT_EXP_HOURS: 24
    ports:
      - "3000:3000"

volumes:
  siakad_pgdata:
